name: Build and publish

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheel:
    name: Build Python distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python tools/build_distributions.py --expected-version "$GITHUB_REF_NAME"

      - name: Check distribution metadata
        run: python -m twine check dist/xponge/* dist/mokda-xponge/*

      - name: Upload Xponge distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xponge-dist
          path: dist/xponge/*
          if-no-files-found: error

      - name: Upload mokda-xponge compatibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mokda-xponge-dist
          path: dist/mokda-xponge/*
          if-no-files-found: error

  publish-xponge:
    name: Publish Xponge to PyPI
    runs-on: ubuntu-latest
    needs: build-wheel
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download Xponge distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: xponge-dist
          path: dist

      - name: Publish Xponge to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-mokda-xponge:
    name: Publish mokda-xponge compatibility package to PyPI
    runs-on: ubuntu-latest
    needs: build-wheel
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download mokda-xponge distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: mokda-xponge-dist
          path: dist

      - name: Publish mokda-xponge to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - publish-xponge
      - publish-mokda-xponge
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
